[project]
name = "feedheat-mcp"
version = "0.1.0"
description = "FeedHeat Crowd — MCP-сервер администратора (создание заказов исполнителям)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 2.x: MCPServer (бывший FastMCP) живёт в mcp.server.mcpserver — на 1.x код не соберётся
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/latenode-com/feedheat-mcp"
Issues = "https://github.com/latenode-com/feedheat-mcp/issues"

[project.scripts]
feedheat-mcp = "feedheat_mcp.server:main"
feedheat-support-mcp = "feedheat_mcp.support_server:main"
feedheat-review-mcp = "feedheat_mcp.review_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feedheat_mcp"]

# Стиль тот же, что в остальном коде FeedHeat
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
